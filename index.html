<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>dela.</title>
<meta name="description" content="dela. — задачи, календарь, матрица Эйзенхауэра, помодоро и привычки в одном приложении">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dela.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{
  --accent:#4772FA; --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#F0F1F5; --line:#E6E8EE;
  --text:#1D2129; --text2:#5B6270; --text3:#9AA0AC;
  --p3:#E5484D; --p2:#F5A524; --p1:#4772FA; --p0:#B4B9C4;
  --ok:#2BB673; --shadow:0 6px 24px rgba(20,24,40,.10); --shadow-sm:0 1px 3px rgba(20,24,40,.08);
  --r:14px; --rail:72px; --side:270px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111215; --surface:#1B1C21; --surface2:#24262C; --line:#2E3038;
  --text:#ECEDF0; --text2:#A4A9B4; --text3:#6C717C; --p0:#5C616C;
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:80px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:1fr;height:100%;height:100dvh}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text3);padding:4px 8px;border-radius:10px;min-width:56px}
.rail button.on{color:var(--accent)}
.rail button svg.i{width:23px;height:23px}
.rail .logo{display:none}
main{overflow:hidden;display:flex;flex-direction:column;min-width:0;height:100%}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(100px + var(--sab))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--sat)) 16px 8px;display:flex;align-items:center;gap:6px}
.top h1{font-size:26px;font-weight:750;letter-spacing:-.4px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text2)}
.ib:hover{background:var(--surface2)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.sub{color:var(--text2);font-size:13px;padding:0 16px 6px;display:flex;align-items:center;gap:10px}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:min(84vw,var(--side));z-index:50;background:var(--surface);
  transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;padding:calc(14px + var(--sat)) 10px calc(20px + var(--sab));box-shadow:var(--shadow)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.side h4{margin:16px 10px 6px;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;justify-content:space-between}
.side h4 button{color:var(--text3)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;color:var(--text);text-align:left}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12.5px;color:var(--text3);font-weight:500}
.nav .ico{width:22px;height:22px;display:grid;place-items:center;font-size:16px}
.brand{display:flex;align-items:center;gap:0;padding:4px 10px 6px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.brand b{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}

/* ---------- tasks ---------- */
.group{margin:14px 0 4px}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--text2);padding:6px 4px;cursor:pointer;user-select:none}
.ghead .n{color:var(--text3);font-weight:500}
.ghead.over{color:var(--p3)}
.ghead svg.i{width:16px;height:16px;transition:transform .2s}
.ghead.closed svg.i{transform:rotate(-90deg)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.swipe{position:relative;overflow:hidden}
.swipe .bgL,.swipe .bgR{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:600;gap:8px}
.swipe .bgR{background:var(--ok)}
.swipe .bgL{background:var(--p3);justify-content:flex-end}
.task{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);touch-action:pan-y;transition:background .15s}
.swipe+.swipe .task{border-top:1px solid var(--line)}
.task:hover{background:color-mix(in srgb,var(--surface2) 50%,var(--surface))}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--pc,var(--p0));flex:none;margin-top:1px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--pc,var(--p0)) 10%,transparent);transition:transform .15s}
.chk:active{transform:scale(.85)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.task.done .chk{background:var(--text3);border-color:var(--text3)}
.task.done .chk svg{opacity:1}
.task.pop .chk{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.p3{--pc:var(--p3)}.p2{--pc:var(--p2)}.p1{--pc:var(--p1)}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{word-break:break-word}
.task.done .tt{color:var(--text3);text-decoration:line-through}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--text3);align-items:center}
.tm span{display:inline-flex;align-items:center;gap:3px}
.tm svg.i{width:13px;height:13px}
.tm .od{color:var(--p3)} .tm .td{color:var(--accent)}
.tag{color:var(--accent)!important;background:var(--accent-soft);border-radius:6px;padding:0 6px}
.flag{width:18px;height:18px;color:var(--pc);margin-top:2px}
.empty{text-align:center;color:var(--text3);padding:60px 20px}
.empty .big{font-size:46px;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* goal ring in header */
.goal{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.ring{--v:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(84px + var(--sab));z-index:20;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.94)}

/* search */
.search{margin:0 16px 8px;position:relative}
.search input{padding-left:38px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:11px;color:var(--text3)}

/* kanban */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;scroll-snap-type:x mandatory}
.col{flex:0 0 min(82vw,300px);scroll-snap-align:start;background:var(--surface2);border-radius:var(--r);padding:10px;min-height:200px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.col h3 .n{color:var(--text3);font-weight:500}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.kc{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-sm);margin-bottom:8px}
.kc .task{background:transparent;border-radius:12px}
.kc .mv{display:flex;justify-content:flex-end;gap:4px;padding:0 8px 6px}
.kc .mv button{font-size:12px;color:var(--text3);padding:3px 8px;border-radius:8px;background:var(--surface2)}

/* calendar */
.calhead{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.calhead b{flex:1;font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm)}
.cal .wd{text-align:center;font-size:11.5px;color:var(--text3);padding:2px 0 6px;font-weight:600}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;font-size:14px;position:relative}
.cal .d.out{color:var(--text3);opacity:.5}
.cal .d.today .num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;margin-top:-3px}
.cal .d.sel{background:var(--accent-soft)}
.cal .d .dots{display:flex;gap:3px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--text3))}
.cal .d .more{font-size:9.5px;color:var(--text3);line-height:1}

/* matrix */
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);min-height:200px;display:flex;flex-direction:column;overflow:hidden;border-top:4px solid var(--qc)}
.q h3{margin:0;padding:10px 12px 6px;font-size:13.5px;color:var(--qc);display:flex;align-items:center;gap:6px}
.q h3 small{color:var(--text3);font-weight:500;margin-left:auto}
.q .ql{flex:1;overflow-y:auto;max-height:42vh}
.q .task{padding:8px 12px;gap:9px;font-size:14px}
.q .task .chk{width:18px;height:18px;border-radius:6px}
.q .addq{color:var(--text3);font-size:13px;padding:8px 12px;text-align:left;display:flex;gap:6px;align-items:center}
.q.drop{outline:2px dashed var(--qc);outline-offset:-3px}

/* focus */
.focus{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.modes{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.modes button{padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--text2)}
.modes button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm)}
.dial{position:relative;width:min(72vw,290px);aspect-ratio:1;margin:26px 0 14px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:10}
.dial .bg{stroke:var(--surface2)} .dial .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial.brk .fg{stroke:var(--ok)}
.dial .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--text)}
.dial .tm small{font-size:13px;color:var(--text3);letter-spacing:0;font-weight:500}
.fbtns{display:flex;gap:16px;align-items:center}
.btn{background:var(--accent);color:#fff;border-radius:999px;padding:12px 34px;font-weight:650;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.danger{background:var(--p3)}
.circle{width:48px;height:48px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--text2)}
.circle.on{color:var(--accent)}
.ftask{margin:18px 0 6px;display:flex;align-items:center;gap:8px;background:var(--surface);padding:9px 14px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:14px;max-width:100%}
.ftask span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:20px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--text3)}

/* habits */
.hab{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.hab .week{width:100%;justify-content:space-between;padding-left:56px}
@media (min-width:700px){.hab .week{width:auto;padding-left:0}}
.hab .em{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);display:grid;place-items:center;font-size:22px;flex:none;cursor:pointer;position:relative}
.hab .em.done{background:var(--c)}
.hab .em.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--surface)}
.hab .hb{flex:1;min-width:0;cursor:pointer}
.hab .hn{font-weight:600}
.hab .hs{font-size:12.5px;color:var(--text3)}
.week{display:flex;gap:5px}
.week button{width:30px;height:30px;border-radius:50%;font-size:10.5px;color:var(--text3);background:var(--surface2);display:grid;place-items:center}
.week button.y{background:var(--c);color:#fff}
.week button.off{opacity:.3}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface2)}
.heat i.y{background:var(--c)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:14px;margin-top:12px}
.panel h3{margin:0 0 10px;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:22px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bars i.z{background:var(--surface2)}
.bars small{font-size:10px;color:var(--text3)}
.bars em{font-size:10px;color:var(--text2);font-style:normal}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.hbar .t{width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{flex:1;height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--c,var(--accent));border-radius:5px}
.hbar .v{width:28px;text-align:right;color:var(--text3)}

/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.38);animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + var(--sab));animation:up .25s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
.sheet h2 .ib{margin-left:auto}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>label{width:96px;color:var(--text2);font-size:14px;display:flex;align-items:center;gap:8px;flex:none}
.row>label svg.i{width:18px;height:18px}
.row .f{flex:1;display:flex;gap:8px;min-width:0;flex-wrap:wrap}
.row .f input,.row .f select{flex:1;min-width:0}
.row .f input[type=time]{flex:0 0 118px}
.row .f input[type=number]{flex:0 0 72px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;background:var(--surface2);font-size:13.5px;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent);color:#fff}
.seg button .flag{width:15px;height:15px;margin:0}
.seg button.on .flag{color:#fff}
.dtitle{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.dtitle textarea{font-size:19px;font-weight:650;background:transparent;border:0;padding:0;min-height:0;resize:none;overflow:hidden}
.dtitle .chk{margin-top:4px}
.subs .s{display:flex;align-items:center;gap:10px;padding:6px 0}
.subs .s input[type=text]{background:transparent;padding:4px 0;border:0;border-radius:0}
.subs .s .chk{width:19px;height:19px;border-radius:50%}
.subs .s.done .chk{background:var(--text3);border-color:var(--text3)}
.subs .s.done .chk svg{opacity:1}
.subs .s.done input{color:var(--text3);text-decoration:line-through}
.subs .s .x{color:var(--text3)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions button{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.actions button.red{color:var(--p3)}
.qa input.main{font-size:17px;padding:13px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;background:var(--surface2);font-size:13px;color:var(--text2)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip svg.i{width:15px;height:15px}
.chip select{background:transparent;border:0;padding:0;width:auto}
.hint{font-size:12.5px;color:var(--text3);line-height:1.5}
.hint code{background:var(--surface2);padding:1px 5px;border-radius:5px;color:var(--text2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--surface);outline:2px solid transparent}
.swatches button.on{outline-color:var(--c)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:38px;height:38px;border-radius:10px;background:var(--surface2);font-size:19px}
.emojis button.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.wdays{display:flex;gap:6px}
.wdays button{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:12.5px}
.wdays button.on{background:var(--accent);color:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);z-index:80;background:#22252C;color:#fff;
  padding:11px 14px 11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);font-size:14px;animation:up .25s;max-width:92vw}
.toast button{color:#8FB0FF;font-weight:650}

/* ---------- desktop ---------- */
@media (min-width:900px){
  #app{grid-template-columns:var(--rail) auto 1fr}
  .rail{position:static;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:16px 0;background:var(--surface);align-items:center}
  .rail .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:20px;margin-bottom:12px}
  .rail button{min-width:0;width:56px}
  .side{position:static;transform:none;box-shadow:none;width:var(--side);border-right:1px solid var(--line);padding-top:16px}
  .side.collapsed{display:none}
  .scrim,.menuBtn{display:none!important}
  .page{padding:0 32px 60px}
  .top{padding:20px 32px 10px}.sub{padding:0 32px 6px}.search{margin:0 32px 8px}
  .fab{bottom:28px;right:32px}
  .toast{bottom:28px}
  .sheetwrap{align-items:center}
  .sheet{border-radius:20px;max-height:86vh}
  .sheet .grab{display:none}
  .mx{grid-template-columns:1fr 1fr;height:calc(100vh - 120px)}
  .q .ql{max-height:none}
  .kan{padding-bottom:30px}
  .col{flex:1 1 0;min-width:260px}
}
@media (min-width:1300px){ .page>.wrap{max-width:860px} }

/* drag & drop */
.task{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.dragging,body.dragging *{cursor:grabbing!important}
.task.drop{box-shadow:inset 0 3px 0 var(--accent)}
.task.drop.dropAfter{box-shadow:inset 0 -3px 0 var(--accent)}
.ghead.drop,.nav.drop,.cal .d.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}
.ghost .chk{pointer-events:none}
#mic.on{background:var(--p3);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.ib.spin svg{animation:spin 1s linear infinite;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.ib.warn{color:var(--p2)}
.subl{margin-top:8px;display:flex;flex-direction:column;gap:1px}
.sbar{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-bottom:5px;max-width:160px}
.sbar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .25s}
.st{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text2);padding:3px 0}
.st .schk{width:18px;height:18px;border-radius:50%;border:1.7px solid var(--text3);display:grid;place-items:center;flex:none;transition:transform .15s}
.st .schk:active{transform:scale(.85)}
.st .schk svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
.st.done .schk{background:var(--ok);border-color:var(--ok)}
.st.done .schk svg{opacity:1}
.st.done span{text-decoration:line-through;color:var(--text3)}
.smore{font-size:12.5px;color:var(--accent);text-align:left;padding:2px 0 0 27px}
.toast{width:max-content}
.q .st{font-size:13px}.q .subl{margin-top:5px}

}

const I = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${P[n] || ''}</svg>`;
const CHK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>';

/* ================= state ================= */
const KEY = 'dela.v1';
function seed() {
  const t = today();
  const mk = (o) => ({ id: uid(), title: '', notes: '', listId: 'inbox', done: false, doneAt: null, createdAt: Date.now(), due: null, time: null, priority: 0, tags: [], subtasks: [], repeat: null, status: 'todo', deleted: false, pomos: 0, ...o });

`Просто пиши задачу — список и теги появятся сами:
• «подготовить отчёт для клиента» → список «Работа»
• «купить молоко и хлеб» → «Покупки», тег #еда
• «позвонить маме вечером» → «Близкие», тег #звонок
• «записаться к стоматологу» → «Здоровье», тег #врач

Даты и время тоже понимаются: «завтра в 18:00», «в пятницу», «25.12», «через 3 дня», «каждый понедельник», «по будням».
Свой список: ~Название, свой тег: #тег, приоритет: !1 !2 !3.

Жесты: свайп вправо — выполнено, свайп влево — удалить (можно отменить).
Бэкап: Настройки → Экспорт.`, subtasks: [{ id: uid(), title: 'Добавить свою первую задачу', done: false }, { id: uid(), title: 'Установить на экран «Домой»', done: false }] }),

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); const s = JSON.parse(raw); if (s && s.version) return migrate(s); } catch (e) { console.error(e); if (raw) { try { localStorage.setItem(KEY + '.backup-' + Date.now(), raw); } catch (x) { } } }
  return seed();
}
function migrate(s) {
  const d = seed();
  s.settings = { ...d.settings, ...(s.settings || {}) };
  for (const k of ['lists', 'tasks', 'habits', 'focus']) if (!Array.isArray(s[k])) s[k] = [];
  s.notified = s.notified || {};
  s.lists.forEach(l => { if (['personal', 'work', 'shop'].includes(l.id) && l.auto === undefined) l.auto = true; });
  return s;
}
let S = load();
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(persist, 60); }
function persist(noSync) {
  clearTimeout(saveT);

const listById = id => id === 'inbox' ? { id: 'inbox', name: 'Входящие', color: '#6B7280', emoji: '📥' } : S.lists.find(l => l.id === id);

/* ================= natural language parser ================= */
const B = '(?:^|\\s)', E = '(?=$|[\\s,.!?;])';
const WDRE = [
  ['понедельник|понедельника|понеділок|понеділка|пн|monday|mon', 0],
  ['вторник|вторника|вівторка|вівторок|вівторка|вт|tuesday|tue', 1],
  ['среду|среда|среды|середу|середа|середи|ср|wednesday|wed', 2],
  ['четверг|четверга|четвер|чт|thursday|thu', 3],
  ['пятницу|пятница|пятницы|п\'ятниці|п\'ятницю|пʼятницю|пятницю|п\'ятниця|пт|friday|fri', 4],
  ['субботу|суббота|субботы|суботи|суботу|субота|сб|saturday|sat', 5],
  ['воскресенье|воскресенья|неділі|неділю|неділя|вс|нд|sunday|sun', 6],
];
const MONRE = ['январ|січ|jan', 'феврал|лют|feb', 'март|берез|mar', 'апрел|квіт|apr', 'ма[йя]|трав|may', 'июн|черв|jun', 'июл|лип|jul', 'август|серп|aug', 'сентябр|верес|sep', 'октябр|жовт|oct', 'ноябр|листопад|nov', 'декабр|груд|dec'];
function nextWd(from, wd, includeToday = false) { let d = includeToday ? 0 : 1; while (wdIdx(addD(from, d)) !== wd) d++; return addD(from, d); }

function parseQuick(input) {
  let s = ' ' + input + ' ';
  const r = { title: '', due: null, time: null, priority: null, tags: [], listId: null, repeat: null };
  const t = today();
  const take = (re, fn) => { s = s.replace(re, (...m) => { const v = fn(...m); return v === false ? m[0] : ' '; }); };

  // tags & list & priority
  take(/(?:^|\s)#([\p{L}\p{N}_-]+)/gu, (_, g) => { if (!r.tags.includes(g.toLowerCase())) r.tags.push(g.toLowerCase()); });
  take(/(?:^|\s)[~@]([\p{L}\p{N}_-]+)/gu, (_, g) => { const l = S.lists.find(l => l.name.toLowerCase().startsWith(g.toLowerCase())) || (/^(входящие|inbox|вхідні)/i.test(g) ? { id: 'inbox' } : null); if (l) r.listId = l.id; else r.newList = g[0].toUpperCase() + g.slice(1); });
  take(/(?:^|\s)(?:!([1-3])|p([1-3])|!!!|!!)(?=$|\s)/gi, (m, a, b) => { const n = a || b; r.priority = n ? 4 - Number(n) : (m.trim() === '!!!' ? 3 : 2); });
  take(new RegExp(B + '(срочно|важно|urgent|терміново)' + E, 'giu'), () => { r.priority = 3; });

  // repeat
  take(new RegExp(B + '(каждый день|ежедневно|щодня|кожного дня|every day|daily)' + E, 'giu'), () => { r.repeat = 'daily'; });
  take(new RegExp(B + '(по будням|по будн[яі]х|every weekday|weekdays)' + E, 'giu'), () => { r.repeat = 'weekdays'; });
  take(new RegExp(B + '(каждую неделю|еженедельно|щотижня|every week|weekly)' + E, 'giu'), () => { r.repeat = 'weekly'; });
  take(new RegExp(B + '(каждый месяц|ежемесячно|щомісяця|every month|monthly)' + E, 'giu'), () => { r.repeat = 'monthly'; });
  take(new RegExp(B + '(каждый год|ежегодно|щороку|every year|yearly)' + E, 'giu'), () => { r.repeat = 'yearly'; });
  for (const [re, wd] of WDRE) take(new RegExp(B + '(?:каждый|каждую|каждое|кожен|кожну|кожного|every)\\s+(?:' + re + ')' + E, 'giu'), () => { r.repeat = 'weekly'; r.due = nextWd(t, wd, true); });

  // time
  take(new RegExp(B + '(?:(?:в|о|об|at|к)\\s*)?(\\d{1,2}):(\\d{2})' + E, 'giu'), (m, h, mi) => { if (+h > 23 || +mi > 59) return false; r.time = `${pad(+h)}:${mi}`; });

function vCal() {
  const m0 = pd(ui.calMonth), T = today();
  const first = ds(m0), startOff = wdIdx(first), start = addD(first, -startOff);
  const daysInMonth = new Date(m0.getFullYear(), m0.getMonth() + 1, 0).getDate();
  const cells = Math.ceil((startOff + daysInMonth) / 7) * 7;
  const byDay = {};
  live().forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });
  // показать будущие повторы
  live().filter(t => t.repeat && !t.done && t.due).forEach(t => {
    let d = t.due, n = 0; const end = addD(start, cells);
    while (n++ < 60) { d = nextDue({ ...t, due: d, repeat: t.repeat }); if (d >= end) break; if (d >= start) (byDay[d] = byDay[d] || []).push({ ...t, ghost: true }); }
  });
  let g = WD.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const d = addD(start, i), x = pd(d), items = (byDay[d] || []).filter(t => !t.done);
    g += `<button class="d ${x.getMonth() !== m0.getMonth() ? 'out' : ''} ${d === T ? 'today' : ''} ${d === ui.calDay ? 'sel' : ''}" data-act="calDay" data-d="${d}" data-drop="day">

    + `<div class="page"><div class="wrap"><div class="calhead"><b>${MONFULL[m0.getMonth()]} ${m0.getFullYear()}</b><button class="ib" data-act="calNav" data-n="-1">${I('left')}</button><button class="ib" data-act="calNav" data-n="1">${I('right')}</button></div>

/* ================= FOCUS (Pomodoro) ================= */
const durOf = m => (m === 'work' ? S.settings.pomo : m === 'short' ? S.settings.short : S.settings.long) * 60;
if (!S.timer) S.timer = { mode: 'work', running: false, endAt: null, remaining: durOf('work'), taskId: null, round: 0 };
const remain = () => S.timer.running ? Math.max(0, (S.timer.endAt - Date.now()) / 1000) : S.timer.remaining;
const mmss = s => `${pad(Math.floor(Math.ceil(s) / 60))}:${pad(Math.ceil(s) % 60)}`;
function vFocus() {
  const tm = S.timer, T = today(), r = remain(), full = durOf(tm.mode), C = 2 * Math.PI * 140;
  const tk = tm.taskId && task(tm.taskId);
  const todays = S.focus.filter(f => ds(new Date(f.at)) === T);
  const mins = todays.reduce((a, f) => a + f.mins, 0);
  const total = S.focus.reduce((a, f) => a + f.mins, 0);
  const days = [...Array(7)].map((_, i) => addD(T, i - 6));
  const per = days.map(d => S.focus.filter(f => ds(new Date(f.at)) === d).reduce((a, f) => a + f.mins, 0));
  const mx = Math.max(25, ...per);
  return topbar('Фокус', `<button class="ib ${ui.noise ? 'on' : ''}" data-act="noise" title="Белый шум">${I('sound')}</button>`, false)
    + `<div class="page"><div class="wrap"><div class="focus">
    <div class="modes">${[['work', 'Помодоро'], ['short', 'Перерыв'], ['long', 'Длинный']].map(([m, n]) => `<button class="${tm.mode === m ? 'on' : ''}" data-act="fmode" data-m="${m}">${n}</button>`).join('')}</div>
    <div class="dial ${tm.mode !== 'work' ? 'brk' : ''}"><svg viewBox="0 0 300 300"><circle class="bg" cx="150" cy="150" r="140"/><circle id="fring" class="fg" cx="150" cy="150" r="140" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - r / full)}"/></svg>
      <div class="tm"><span id="ftime">${mmss(r)}</span><small>${tm.mode === 'work' ? `Сессия ${tm.round % 4 + 1} из 4` : 'Отдохни 🌿'}</small></div></div>
    <div class="fbtns"><button class="circle" data-act="freset" title="Сбросить">${I('reset')}</button>
      <button class="btn" data-act="fstart" style="min-width:150px">${tm.running ? 'Пауза' : r < full ? 'Продолжить' : 'Старт'}</button>
      <button class="circle" data-act="fskip" title="Пропустить">${I('skip')}</button></div>
    <button class="ftask" data-act="fpick">${tk ? `🍅 <span>${esc(tk.title)}</span>` : `${I('tasks')}<span>Выбрать задачу для фокуса</span>`}</button>
    <div class="stats3"><div class="stat"><b>${todays.length}</b><span>помидоров сегодня</span></div><div class="stat"><b>${Math.floor(mins / 60) ? Math.floor(mins / 60) + 'ч ' : ''}${mins % 60}м</b><span>фокус сегодня</span></div><div class="stat"><b>${Math.round(total / 60)}ч</b><span>всего</span></div></div>
    <div class="panel" style="width:100%"><h3>Минуты фокуса за 7 дней</h3><div class="bars">${per.map((v, i) => `<div><em>${v || ''}</em><i class="${v ? '' : 'z'}" style="height:${v / mx * 100}%"></i><small>${WD[wdIdx(days[i])]}</small></div>`).join('')}</div></div>
    </div></div></div>`;
}
function fStart() {
  const tm = S.timer;
  if (tm.running) { tm.remaining = remain(); tm.running = false; tm.endAt = null; }
  else { tm.running = true; tm.endAt = Date.now() + tm.remaining * 1000; askNotify(); unlockAudio(); }
  save(); render();
}
function fSet(mode) { Object.assign(S.timer, { mode, running: false, endAt: null, remaining: durOf(mode) }); save(); render(); }
function fFinish(skipped) {
  const tm = S.timer;
  if (tm.mode === 'work') {
    if (!skipped) { S.focus.push({ at: Date.now(), mins: S.settings.pomo, taskId: tm.taskId }); const t = tm.taskId && task(tm.taskId); if (t) t.pomos = (t.pomos || 0) + 1; }
    tm.round++; tm.mode = tm.round % 4 === 0 ? 'long' : 'short';
    if (!skipped) notify('🍅 Помидор завершён', 'Время отдохнуть ' + (tm.mode === 'long' ? S.settings.long : S.settings.short) + ' мин');
  } else { tm.mode = 'work'; if (!skipped) notify('⏰ Перерыв окончен', 'Возвращаемся к фокусу'); }
  tm.running = false; tm.endAt = null; tm.remaining = durOf(tm.mode);
  save(); render();
}
function tickFocus() {

/* audio */
let AC, noiseNode;
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) { } }
function chime() {
  if (!S.settings.sound) return; unlockAudio(); if (!AC) return;
  [0, .18, .36].forEach((t, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = [880, 1175, 1568][i];
    g.gain.setValueAtTime(0, AC.currentTime + t); g.gain.linearRampToValueAtTime(.25, AC.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t + .6);
    o.connect(g).connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .7); });
}
function toggleNoise() {
  unlockAudio(); if (!AC) return;
  if (noiseNode) { noiseNode.stop(); noiseNode = null; ui.noise = false; render(); return; }
  const len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.2; }
  const src = AC.createBufferSource(), g = AC.createGain(); g.gain.value = .5; src.buffer = buf; src.loop = true; src.connect(g).connect(AC.destination); src.start();

}

function reminderLoop() {

/* ================= HABITS ================= */
const isSched = (h, d) => h.days.includes(wdIdx(d));

  let n = 0, d = today(); if (!h.log[d]) d = addD(d, -1);
  for (let i = 0; i < 1000; i++) { if (isSched(h, d)) { if (h.log[d]) n++; else break; } d = addD(d, -1); if (d < h.createdAt && !h.log[d]) break; }
  return n;
}
function bestStreak(h) {

  let best = 0, cur = 0, d = keys[0] < h.createdAt ? keys[0] : h.createdAt; const T = today();
  while (d <= T) { if (isSched(h, d)) { if (h.log[d]) { cur++; best = Math.max(best, cur); } else if (d !== T) cur = 0; } d = addD(d, 1); }
  return best;
}
function vHabits() {

  if (!hs.length) h += `<div class="empty"><div class="big">🌱</div><b>Начни новую привычку</b>Отмечай каждый день и следи за серией</div>`;

  let st = 0, d = T; const set = new Set(done.map(dOf)); if (!set.has(d)) d = addD(d, -1); while (set.has(d)) { st++; d = addD(d, -1); }

      SY.token = h.get('access_token'); SY.exp = Date.now() + (+h.get('expires_in') || 3600) * 1000;
      const first = !SY.on; SY.on = true; SY.need = false; sySave();

  snap(); s.done = !s.done; buzz();

    setTimeout(() => { toggleTask(t.id, $(`main .task[data-id="${t.id}"]`)); toast('Все подзадачи готовы — задача выполнена', true); }, 250);
  } else setTimeout(render, el ? 180 : 0);
}

/* ================= drag & drop (мышь + долгое нажатие на телефоне) ================= */
let dd = null; // { id, el, ghost, x, y, started, timer, target }
const GROUP_DUE = { today: 0, tom: 1, week: 2, later: 8 };
function ddStart(x, y) {
  const el = dd.el; dd.started = true; sw = null; buzz();
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true); g.className += ' ghost';
  Object.assign(g.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', zIndex: 90, pointerEvents: 'none', boxShadow: 'var(--shadow)', borderRadius: '12px', opacity: .95, transform: 'scale(1.03) rotate(-1deg)', background: 'var(--surface)' });
  dd.dx = x - r.left; dd.dy = y - r.top; dd.ghost = g; document.body.appendChild(g);
  el.style.opacity = .35; document.body.classList.add('dragging');
  if (ui.side) { ui.side = false; $('.side').classList.remove('open'); $('.scrim').classList.remove('on'); }
}
function ddMove(x, y) {
  if (!dd?.started) return;
  dd.ghost.style.left = (x - dd.dx) + 'px'; dd.ghost.style.top = (y - dd.dy) + 'px';
  const under = document.elementFromPoint(x, y);
  let z = under?.closest('[data-drop]');
  if (z && z.dataset.drop === 'task' && !z.dataset.g) z = z.parentElement?.closest('[data-drop]');
  if (z && z.dataset.drop === 'task' && z.dataset.id === dd.id) z = null;
  $$('.drop').forEach(e => e !== z && e.classList.remove('drop', 'dropAfter'));
  if (z) { z.classList.add('drop'); if (z.dataset.drop === 'task') { const r = z.getBoundingClientRect(); z.classList.toggle('dropAfter', y > r.top + r.height / 2); } }
  dd.target = z;
  // автопрокрутка
  const pg = $('main .page'), ql = under?.closest('.ql,.kan');
  if (pg) { if (y < 90) pg.scrollTop -= 12; else if (y > innerHeight - 110) pg.scrollTop += 12; }
  if (ql?.classList.contains('kan')) { if (x < 40) ql.scrollLeft -= 14; else if (x > innerWidth - 40) ql.scrollLeft += 14; }
}
function ddEnd() {
  if (!dd) return; clearTimeout(dd.timer);
  const { started, target: z, id, el, ghost } = dd; dd = null;
  if (!started) return;
  ui.swiped = Date.now(); // гасим клик после перетаскивания
  ghost.remove(); el.style.opacity = ''; document.body.classList.remove('dragging');
  $$('.drop').forEach(e => e.classList.remove('drop', 'dropAfter'));
  const t = task(id); if (!t || !z) return;
  snap(); const T = today(); let msg = 'Задача перемещена';
  const kind = z.dataset.drop;
  if (kind === 'q') { const q = QUADS[+z.dataset.q - 1]; t.priority = q.p; msg = `Приоритет: ${PRIO[q.p]}`; }
  else if (kind === 'col') { const s2 = z.dataset.col; if (s2 === 'done') { if (!t.done) return toggleTask(t.id); } else { if (t.done) { t.done = false; t.doneAt = null; } t.status = s2; } msg = s2 === 'doing' ? 'В процессе' : 'Нужно сделать'; }
  else if (kind === 'day') { t.due = z.dataset.d; delete S.notified[t.id]; ui.calDay = t.due; msg = `Перенесено на ${fmtDate(t.due)}`; }
  else if (kind === 'nav') {
    const k = z.dataset.k;
    if (k === 'inbox') t.listId = 'inbox'; else if (k.startsWith('list:')) t.listId = k.slice(5);
    else if (k === 'today') t.due = T; else if (k === 'next7') t.due = addD(T, 1);
    else if (k === 'important') t.priority = 3; else if (k.startsWith('tag:')) { if (!t.tags.includes(k.slice(4))) t.tags.push(k.slice(4)); }
    else if (k === 'trash') { save(); return deleteTask(t.id); } else if (k === 'done') { save(); return toggleTask(t.id); }
    msg = `→ ${scopeName(k)}`;
  }
  else if (kind === 'group' || kind === 'task') {
    const g = z.dataset.g;
    applyGroup(t, g);
    if (kind === 'task') { // ручной порядок
      const other = task(z.dataset.id), after = z.classList.contains('dropAfter') || false;
      const sib = $$(`main .task[data-g="${g}"]`).map(e => e.dataset.id).filter(x => x !== t.id);
      let idx = sib.indexOf(other?.id); if (idx < 0) idx = sib.length; else if (z.getBoundingClientRect && after) idx++;
      sib.splice(idx, 0, t.id); sib.forEach((x, i) => { const y = task(x); if (y) y.order = i; });
      if (S.settings.sort !== 'manual' && !['priority', 'title', 'created'].includes(S.settings.sort)) S.settings.sort = 'manual';
      if (!['priority'].includes(S.settings.sort)) msg = 'Порядок изменён';
    } else msg = 'Задача перемещена';
  }
  save(); render(); toast(msg, true);
}
function applyGroup(t, g) {
  const T = today();
  if (!g || g === 'pin' || g === 'search' || g === 'doneSec') return;
  if (g === 'over') return;
  if (g === 'nodate') { t.due = null; t.time = null; return; }
  if (g in GROUP_DUE) { const cur = t.due ? bucket(t)[0] : 'nodate'; if (cur !== g) t.due = addD(T, GROUP_DUE[g]); return; }
  if (/^d\d$/.test(g)) { t.due = addD(T, +g.slice(1)); return; }
  if (/^p\d$/.test(g)) { t.priority = +g.slice(1); return; }
  if (g === 'all') return;
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
if (!S.tagsV3) { S.tagsV3 = 1; S.tagsV2 = 1; S.tasks.forEach(t => {
  if (t.deleted || t.done || !t.title || t.title.startsWith('👋')) return;
  if (t.listId === 'inbox') { const g = guessList(t.title); if (g) t.listId = ensureList(g.name, g.emoji, g.color).id; }
  const auto = t.autoTags || [], manual = (t.tags || []).filter(g => !auto.includes(g));
  if (!manual.length || auto.length) { t.autoTags = guessTags(t.title, listById(t.listId)?.name).filter(g => !manual.includes(g)); t.tags = [...manual, ...t.autoTags]; }
}); save(); }
if (!S.tagsV2) { S.tagsV2 = 1; S.tasks.forEach(t => { if (!t.deleted && !t.done && !(t.tags || []).length && t.title && !t.title.startsWith('👋')) { t.tags = guessTags(t.title, listById(t.listId)?.name); t.autoTags = [...t.tags]; } }); save(); }
syncInit();
render();
reminderLoop();
syncStart();
